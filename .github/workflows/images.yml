name: images

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read VERSION
        id: version
        run: |
          value=$(tr -d '[:space:]' < VERSION)
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  linux-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armhf, armel, i686, ppc6xx, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      - name: Build linux ${{ matrix.arch }} tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          platforms: linux/amd64
          provenance: false
          push: false
          outputs: type=local,dest=out
          build-args: |
            TARGET=linux-${{ matrix.arch }}

      - name: Upload linux ${{ matrix.arch }} tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: out/linux-${{ matrix.arch }}.tar.gz
          retention-days: 5

  freebsd-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build freebsd ${{ matrix.arch }} tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          platforms: linux/amd64
          provenance: false
          push: false
          outputs: type=local,dest=out
          build-args: |
            TARGET=freebsd-${{ matrix.arch }}

      - name: Upload freebsd ${{ matrix.arch }} tarball
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.arch }}
          path: out/freebsd-${{ matrix.arch }}.tar.gz
          retention-days: 5

  android-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build android tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          platforms: linux/amd64
          provenance: false
          push: false
          outputs: type=local,dest=out
          build-args: |
            TARGET=android

      - name: Upload android tarball
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/android.tar.gz
          retention-days: 5

  linux-image:
    needs: [prepare, linux-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armhf, armel, i686, ppc6xx, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download linux ${{ matrix.arch }} tarball
        uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push linux ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: image
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:linux-${{ matrix.arch }}-${{ needs.prepare.outputs.image_version }}
          build-args: |
            TARGET=linux-${{ matrix.arch }}
            IMAGE_VERSION=${{ needs.prepare.outputs.image_version }}

  freebsd-image:
    needs: [prepare, freebsd-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download freebsd ${{ matrix.arch }} tarball
        uses: actions/download-artifact@v8
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push freebsd ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: image
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:freebsd-${{ matrix.arch }}-${{ needs.prepare.outputs.image_version }}
          build-args: |
            TARGET=freebsd-${{ matrix.arch }}
            IMAGE_VERSION=${{ needs.prepare.outputs.image_version }}

  android-image:
    needs: [prepare, android-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download android tarball
        uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push android
        uses: docker/build-push-action@v7
        with:
          context: .
          target: image
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:android-${{ needs.prepare.outputs.image_version }}
          build-args: |
            TARGET=android
            IMAGE_VERSION=${{ needs.prepare.outputs.image_version }}

  all-image:
    needs: [prepare, linux-toolchain, freebsd-toolchain, android-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download linux tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Download freebsd tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: freebsd-*
          path: dist
          merge-multiple: true

      - name: Download android tarball
        uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push all
        uses: docker/build-push-action@v7
        with:
          context: .
          target: image
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:all-${{ needs.prepare.outputs.image_version }}
          build-args: |
            TARGET=all
            IMAGE_VERSION=${{ needs.prepare.outputs.image_version }}
